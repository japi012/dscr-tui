[package]
name = "dscr"
version = "0.1.0"
edition = "2024"

[dependencies]
bimap = "0.6.3"
clap = { version = "4.6.10", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["bracketed-paste", "event-stream"] }
futures-util = "0.3.34"
rand = "0.10.4"
ratatui = { version = "0.30.2", features = ["palette"] }
ratatui-textarea = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
